[package]
edition = "2024"
name = "ledger"
version = "0.1.0"

[dependencies]
# CBOR
cbor-util = { workspace = true }
tinycbor = { workspace = true }
tinycbor-derive = { workspace = true }

# Crypto Traits
digest = { workspace = true }

# Data types
hashbrown = { version = "0.16", default-features = false, features = [
    "inline-more",
] }
mitsein = { workspace = true }
rug = { workspace = true }

# Hashing
blake2 = { workspace = true }
crc32fast = { workspace = true }
sha3 = { workspace = true }
sha2 = { workspace = true }

# Public Key Cryptography
signature = { workspace = true }
bip32 = { path = "../bip32" }
ed25519-dalek = { workspace = true, features = ["digest", "pkcs8", "hazmat"] }
curve25519-dalek = { workspace = true }
# TODO: remove once ed25519-dalek has a zerocopy feature flag is merged
ed25519 = { workspace = true }
kes = { path = "../kes" }

# Utilities
bech32 = "0.11"
displaydoc = { workspace = true }
duplicate = { path = "duplicate" }
hybrid-array = { workspace = true, features = ["zerocopy"] }
ref-cast = { workspace = true }
sparse-struct = { path = "sparse-struct" }
thiserror = { workspace = true }
zerocopy = { workspace = true }
yoke = { workspace = true }

[dev-dependencies]
anyhow = "1"
bs58 = "0.5"
const-hex = { workspace = true }

[[test]]
harness = false
name = "chain"
